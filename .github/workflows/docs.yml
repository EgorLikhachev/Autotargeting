# Documentation checks: markdown linting + link checking.
# Runs on changes to docs, README, and issue/PR templates.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          # Globs relative to repo root. We lint top-level docs and the
          # nested workspace docs/ folder.
          globs: |
            *.md
            .github/**/*.md
            auto-targeting/*.md
            auto-targeting/docs/**/*.md
            auto-targeting/ai-context/*.md
          config: .markdownlint-cli2.jsonc

  link-check:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Scan all Markdown; fail only on broken links (not network blips).
          args: >-
            --no-progress
            --max-concurrency 16
            --cache
            '*.md'
            '.github/**/*.md'
            'auto-targeting/**/*.md'
          fail: true
