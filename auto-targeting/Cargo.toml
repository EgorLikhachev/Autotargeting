[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/video-capture",
    "crates/yolov8",
    "crates/cv-inference",
    "crates/cv-visualizer",
    "crates/system-telemetry",
    "crates/target-tracker",
    "crates/fc-adapter",
    "crates/commander",
    "crates/cli",
    "crates/shmem-buffer",
    "crates/video-recorder",
    "crates/event-bus",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["Auto-Targeting Team"]
repository = "https://github.com/EgorLikhachev/Autotargeting"
readme = "README.md"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Errors
thiserror = "1.0"
anyhow = "1.0"

# Concurrency primitives
parking_lot = "0.12"
crossbeam-channel = "0.5"
dashmap = "6.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Image processing
jpeg-decoder = "0.3"

# FFI (shm ioctls, memfd)
libc = "0.2"

# Event bus (D-014)
zenoh = "1"

# HTTP server (for health endpoint)
axum = "0.7"
tower = "0.5"

# Systemd notify
sd-notify = "0.4"

# Async trait
async-trait = "0.1"

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Internal crates (for cross-crate deps)
common = { path = "crates/common", version = "0.1.0" }
video-capture = { path = "crates/video-capture", version = "0.1.0" }
yolov8 = { path = "crates/yolov8", version = "0.1.0" }
cv-inference = { path = "crates/cv-inference", version = "0.1.0" }
cv-visualizer = { path = "crates/cv-visualizer", version = "0.1.0" }
system-telemetry = { path = "crates/system-telemetry", version = "0.1.0" }
target-tracker = { path = "crates/target-tracker", version = "0.1.0" }
fc-adapter = { path = "crates/fc-adapter", version = "0.1.0" }
commander = { path = "crates/commander", version = "0.1.0" }
shmem-buffer = { path = "crates/shmem-buffer", version = "0.1.0" }
video-recorder = { path = "crates/video-recorder", version = "0.1.0" }
event-bus = { path = "crates/event-bus", version = "0.1.0" }

# Test deps (applied via [dev-dependencies] in each crate)
proptest = "1.4"
tokio-test = "0.4"
mockall = "0.12"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.dev]
opt-level = 1  # Slight optimization for dev — needed for image processing to be tolerable
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"  # On panic, abort immediately — better than unwinding in safety-critical embedded

[profile.bench]
inherits = "release"
debug = true
