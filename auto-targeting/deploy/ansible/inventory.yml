# Auto-Targeting System — Ansible deployment
#
# Deploy auto-targeting binary + config to Orange Pi 5.
#
# Usage:
#   cd deploy/ansible
#   ansible-playbook -i inventory.yml deploy.yml
#
# First time (provisioning):
#   ansible-playbook -i inventory.yml provision.yml
#
# Rollback:
#   ansible-playbook -i inventory.yml deploy.yml -e "rollback=true"

all:
  hosts:
    orangepi5:
      ansible_host: "{{ lookup('env', 'ORANGE_PI_IP') | default('192.168.1.100') }}"
      ansible_user: "{{ lookup('env', 'ORANGE_PI_USER') | default('orangepi') }}"
      ansible_ssh_pass: "{{ lookup('env', 'ORANGE_PI_PASS') | default('') }}"
      # Или использовать SSH key (рекомендуется):
      # ansible_ssh_private_key_file: ~/.ssh/id_rsa_orangepi
