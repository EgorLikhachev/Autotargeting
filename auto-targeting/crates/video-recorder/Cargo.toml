[package]
name = "video-recorder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "TG26-125: independent video-recorder consumer of the SHM frame ring (ffmpeg rawvideo pipe, OSD)"

[dependencies]
common = { workspace = true }
shmem-buffer = { workspace = true }
video-capture = { workspace = true }
cv-visualizer = { workspace = true }
event-bus = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { workspace = true }
image = { version = "0.25", default-features = false }
ab_glyph = "0.2"

[features]
default = []
# Direct V4L2 capture for the camera_publisher example (PS Eye/gspca
# requires the direct ioctl path; the v4l crate hangs on it).
v4l2-direct-cam = ["video-capture/v4l2-direct"]

[dev-dependencies]
video-capture = { workspace = true, features = ["v4l2-direct"] }
tokio = { workspace = true }
criterion = { workspace = true }
tempfile = "3.10"
