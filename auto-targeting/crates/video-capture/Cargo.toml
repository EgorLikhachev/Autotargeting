[package]
name = "video-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
common = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jpeg-decoder = { workspace = true }

[features]
# V4L2 support requires libclang (for v4l2-sys-mit bindings).
# Enable on Linux targets where libclang is available:
#   cargo build -p video-capture --features v4l2
# On Orange Pi 5 / CI runners with libclang-dev installed, enable by default
# in the workspace config or via --features.
default = []
v4l2 = ["dep:v4l"]
# Direct V4L2 capture via libc ioctl (no v4l crate abstraction overhead).
# ~5x faster than v4l crate on RK3588 (21 FPS → 90+ FPS). Linux-only.
# Enable with: cargo build -p video-capture --features v4l2-direct
v4l2-direct = ["dep:libc"]

[dependencies.v4l]
version = "0.14"
optional = true

# libc for direct V4L2 ioctl (v4l2-direct feature).
[dependencies.libc]
version = "0.2"
optional = true

[dev-dependencies]
tokio-test = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
jpeg-decoder = { workspace = true }
common = { workspace = true }
tempfile = "3.10"
