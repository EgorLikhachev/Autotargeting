[package]
name = "yolov8"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

description = "Pure-Rust YOLOv8 preprocessing / postprocessing (letterbox, output parser, NMS glue). Backend-agnostic — shared by CpuInferenceBackend (ONNX) and the C++ RKNN-bridge reference."

[dependencies]
common = { workspace = true }
chrono = { workspace = true }

[[bench]]
name = "postprocess"
harness = false

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[lib]
name = "yolov8"
path = "src/lib.rs"
