name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast checks on every PR — target < 5 min
  pr-check:
    name: PR check (fmt, clippy, test)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev v4l-utils

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests (without v4l2 feature)
        run: cargo test --workspace --verbose

      # Phase 1.1: real ONNX-backed CPU inference tests (yolov8 + CpuInferenceBackend).
      # Requires ort to download+link the ONNX Runtime shared lib (works on Linux).
      - name: Run CPU-ONNX inference tests
        run: cargo test -p yolov8 -p cv-inference --features cpu-onnx --verbose

      - name: Run V4L2 vivid tests (requires vivid kernel module + libclang)
        env:
          VIVID_TESTS: "1"
        run: |
          sudo modprobe vivid 2>/dev/null || true
          if ls /dev/video* 2>/dev/null; then
            echo "vivid loaded — building with v4l2 feature"
            cargo test -p video-capture --features v4l2 -- --include-ignored vivid
          else
            echo "vivid not available — skipping vivid-gated tests"
          fi

      - name: Run scenario suite
        run: |
          cargo run -p auto-targeting-cli -- scenario --all sim/scenarios/

      - name: Check for known vulnerabilities
        run: |
          cargo install cargo-audit --locked || true
          cargo audit || true

  # Coverage report — runs on every PR
  coverage:
    name: Code coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin || true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tarpaulin
        run: |
          cargo tarpaulin \
            --workspace \
            --exclude-files target \
            --out Xml \
            --output-dir coverage \
            --timeout 300 \
            -- --test-threads=2 || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/cobertura.xml
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Phase 1.1 soak test — runs a short (2 min) smoke of the minimal CV loop
  # (video → inference → annotate → metrics) on every main push. The full
  # 30-minute soak is run manually via scripts/soak_30min.sh on hardware.
  soak-test:
    name: Soak test (minimal CV loop, 2 min)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: pr-check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-soak-${{ hashFiles('**/Cargo.lock') }}

      - name: Download baseline model
        run: ./scripts/download_models.sh

      - name: Run 2-minute soak (synthetic source + COCO model)
        run: |
          cargo run --release -p cv-inference --example soak --features cpu-onnx -- \
            --minutes 2 \
            --model models/yolov8n.onnx \
            --output output/soak

      - name: Soak summary
        if: always()
        run: cat output/soak/summary.json || true

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-run
          path: output/soak/
          retention-days: 7

  # SITL integration tests — runs on main pushes
  sitl-tests:
    name: SITL integration tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: pr-check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io docker-compose-v2 python3-pip
          pip3 install --user pymavlink

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sitl-${{ hashFiles('**/Cargo.lock') }}

      - name: Build ArduPilot SITL Docker image
        run: |
          cd sim/sitl
          docker build -t auto-targeting-sitl:latest .

      - name: Start SITL
        run: |
          cd sim/sitl
          docker compose up -d
          # Wait for port 5760 to be ready
          timeout 120 bash -c 'until nc -z 127.0.0.1 5760; do sleep 2; echo "waiting for SITL..."; done'
          echo "SITL is ready"

      - name: Run SITL integration tests
        run: |
          cargo test -p fc-adapter --test sitl_integration -- --include-ignored --test-threads=1

      - name: SITL logs
        if: always()
        run: |
          cd sim/sitl
          docker compose logs || true

      - name: Stop SITL
        if: always()
        run: |
          cd sim/sitl
          docker compose down || true

  # Cross-compile for Orange Pi 5 (aarch64) — target < 10 min
  cross-compile:
    name: Cross-compile (aarch64)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: pr-check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}

      - name: Configure cargo for cross-compilation
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build for aarch64
        run: cargo build --release --target aarch64-unknown-linux-gnu -p auto-targeting-cli

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-targeting-aarch64
          path: |
            target/aarch64-unknown-linux-gnu/release/auto-targeting
          retention-days: 14

  # Smoke test the built binary in an aarch64 emulator (QEMU)
  smoke-test:
    name: Smoke test binary (QEMU)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: cross-compile
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: auto-targeting-aarch64
          path: ./bin

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Run health check
        run: |
          chmod +x ./bin/auto-targeting
          qemu-aarch64-static -L /usr/aarch64-linux-gnu ./bin/auto-targeting --health-check
